<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Confirmados — Gran Fiesta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f172a;
            --purpura: #7c3aed;
            --rosa: #ec4899;
            --cyan: #38bdf8;
            --exito: #22c55e;
            --alerta: #f59e0b;
            --texto: #f8fafc;
            --plata: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 16px 80px;
            color: var(--texto);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 820px;
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            color: white;
            line-height: 1.1;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
        }

        header p {
            font-size: 0.85rem;
            letter-spacing: 3px;
            color: var(--rosa);
            text-transform: uppercase;
            font-weight: 700;
            margin-top: 6px;
        }

        .nav-pills {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .pill-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1.5px solid var(--purpura);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: white;
            text-decoration: none;
            transition: all 0.3s;
        }

        .pill-btn:hover {
            background: var(--purpura);
            transform: translateY(-2px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            width: 100%;
            max-width: 840px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.7);
            border-radius: 20px;
            padding: 24px 18px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            border-top: 5px solid var(--rosa);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s;
        }

        .stat-card.confirmed { border-top-color: var(--exito); }
        .stat-card.pending { border-top-color: var(--alerta); }

        .stat-num {
            font-family: 'Cinzel', serif;
            font-size: 2.8rem;
            font-weight: 800;
            line-height: 1.1;
            margin: 6px 0;
        }

        .stat-card.confirmed .stat-num { color: var(--exito); }
        .stat-card.pending .stat-num { color: var(--alerta); }

        .stat-title {
            font-size: 0.72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--plata);
            font-weight: 700;
        }

        .panel-table-wrap {
            background: rgba(30, 41, 59, 0.7);
            border-radius: 26px;
            padding: 35px 28px;
            width: 100%;
            max-width: 840px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tools-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-in {
            flex: 1;
            min-width: 240px;
            padding: 12px 18px;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            background: rgba(15, 23, 42, 0.8);
            color: white;
            border-radius: 50px;
            font-size: 0.85rem;
            outline: none;
            font-family: inherit;
        }

        .search-in:focus { border-color: var(--rosa); }

        .btn-exp {
            background: linear-gradient(135deg, var(--purpura), var(--rosa));
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-exp:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .guests-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }

        .guests-table th {
            text-align: left;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.5);
            color: var(--rosa);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            font-weight: 700;
        }

        .guests-table td {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .pill-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .pill-badge.si { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
        .pill-badge.no { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border: 1px solid #f59e0b; }

        @media (max-width: 650px) {
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

    <header>
        <h1>[NOMBRE]</h1>
        <p>Dashboard de Asistencia & Accesos VIP</p>
        <div class="nav-pills">
            <a href="index.html" class="pill-btn" target="_blank">👁️ Invitación Digital</a>
            <a href="admin.html" class="pill-btn">⚙️ Generador de Pases</a>
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card confirmed">
            <div class="stat-title">Pases Confirmados</div>
            <div class="stat-num" id="statConf">0</div>
            <span style="font-size: 0.72rem; color: #4ade80; font-weight: 600;">Asistirán al evento</span>
        </div>
        <div class="stat-card pending">
            <div class="stat-title">Pases Pendientes</div>
            <div class="stat-num" id="statPend">0</div>
            <span style="font-size: 0.72rem; color: #fcd34d; font-weight: 600;">Por confirmar</span>
        </div>
        <div class="stat-card">
            <div class="stat-title">Total de Pases</div>
            <div class="stat-num" id="statTot">0</div>
            <span style="font-size: 0.72rem; color: var(--plata); font-weight: 600;">Reservados en total</span>
        </div>
    </div>

    <div class="panel-table-wrap">
        <div class="tools-bar">
            <input type="text" class="search-in" id="inpSearch" placeholder="🔍 Buscar invitado..." onkeyup="filtrar()">
            <button class="btn-exp" onclick="descargarCSV()">📥 Exportar a Excel (CSV)</button>
        </div>

        <div style="overflow-x: auto;">
            <table class="guests-table">
                <thead>
                    <tr>
                        <th>Invitado / Familia</th>
                        <th>Pases</th>
                        <th>Estado de Asistencia</th>
                    </tr>
                </thead>
                <tbody id="rowsBody">
                    <!-- Dinámico -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sheetsFromUrl = urlParams.get('s') ? decodeURIComponent(urlParams.get('s')).trim() : '';
        const EVENT_KEY = 'Fiestas_Plantilla';
        const GOOGLE_SHEETS_URL = sheetsFromUrl || localStorage.getItem('sheets_url_' + EVENT_KEY) || '';
        // =========================================================================
        // 🔒 CONFIGURACIÓN INTERNA
        // =========================================================================
        const CONFIG_DASHBOARD = {
            GOOGLE_SHEETS_URL: '' // Pega aquí la URL de Google Apps Script del cliente (/exec)
        };
        // =========================================================================

        let registros = [];

        async function cargarRegistros() {
            try {
                if (CONFIG_DASHBOARD.GOOGLE_SHEETS_URL) {
                    const res = await fetch(CONFIG_DASHBOARD.GOOGLE_SHEETS_URL);
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        registros = data.map(item => ({
                            familia: item.nombre || item.familia || item.Familia || 'Invitado',
                            pases: parseInt(item.pases || item.Pases || 1),
                            confirmado: item.confirmado || item.Confirmado || 'Pendiente',
                            fecha: item.fecha_confirmacion || item.fecha || '',
                            link: item.link_invitacion || item.link || ''
                        }));
                        render();
                        return;
                    }
                }
            } catch (e) {
                console.warn('Conexión Sheets fallida, cargando memoria local:', e);
            }

            const local = JSON.parse(localStorage.getItem('fiesta_plantilla_invitados') || '[]');
            registros = local;
            render();
        }

        function render(filtro = '') {
            const tbody = document.getElementById('rowsBody');
            tbody.innerHTML = '';

            let total = 0;
            let conf = 0;
            let pend = 0;

            registros.forEach(item => {
                const n = parseInt(item.pases) || 1;
                total += n;
                const isSi = item.confirmado && item.confirmado.toLowerCase().includes('sí');
                if (isSi) conf += n;
                else pend += n;
            });

            document.getElementById('statTot').innerText = total;
            document.getElementById('statConf').innerText = conf;
            document.getElementById('statPend').innerText = pend;

            const filtrados = registros.filter(r => 
                r.familia.toLowerCase().includes(filtro.toLowerCase())
            );

            if (filtrados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #94a3b8; padding: 25px;">No se encontraron registros.</td></tr>`;
                return;
            }

            filtrados.forEach(r => {
                const tr = document.createElement('tr');
                const isSi = r.confirmado && r.confirmado.toLowerCase().includes('sí');
                const fechaTxt = r.fecha || '—';
                const linkBtn = r.link ? `<button style="padding: 4px 10px; border-radius: 50px; border: none; background: #e0f2f1; color: #00796b; font-weight: 700; font-size: 0.72rem; cursor: pointer;" onclick="navigator.clipboard.writeText('${r.link}'); alert('¡Enlace copiado!');">📋 Copiar</button>` : '—';
                tr.innerHTML = `
                    <td style="font-weight: 600;">${r.familia}</td>
                    <td><strong>${r.pases}</strong></td>
                    <td>
                        <span class="pill-badge ${isSi ? 'si' : 'no'}">
                            ${isSi ? 'Confirmado ✅' : 'Pendiente ⏳'}
                        </span>
                    </td>
                    <td style="font-size: 0.75rem; color: #64748b;">${fechaTxt}</td>
                    <td>${linkBtn}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filtrar() {
            render(document.getElementById('inpSearch').value);
        }

        function descargarCSV() {
            let csv = 'Nombre,Pases,Confirmado,Fecha_Confirmacion,Link_Invitacion\n';
            registros.forEach(r => {
                csv += `"${r.familia}",${r.pases},"${r.confirmado}","${r.fecha || ''}","${r.link || ''}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `confirmados_Fiesta_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        cargarRegistros();
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Confirmados — Alex 25th Birthday</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #070d17;
            --purpura: #8b5cf6;
            --rosa: #ec4899;
            --cyan: #06b6d4;
            --exito: #22c55e;
            --alerta: #f59e0b;
            --texto: #f8fafc;
            --plata: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #070d17 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 16px 80px;
            color: var(--texto);
        }

        header { text-align: center; margin-bottom: 30px; width: 100%; max-width: 820px; }
        header h1 { font-size: 2.8rem; font-weight: 900; color: white; line-height: 1.1; text-transform: uppercase; letter-spacing: 2px; }
        header p { font-size: 0.85rem; letter-spacing: 3px; color: var(--cyan); text-transform: uppercase; font-weight: 700; margin-top: 6px; }

        .nav-pills { display: flex; justify-content: center; gap: 12px; margin-top: 15px; flex-wrap: wrap; }
        .pill-btn {
            background: rgba(255, 255, 255, 0.08); border: 1.5px solid var(--cyan); padding: 8px 18px; border-radius: 50px;
            font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--cyan); text-decoration: none;
            transition: all 0.3s;
        }
        .pill-btn:hover { background: var(--cyan); color: #070d17; transform: translateY(-2px); }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; width: 100%; max-width: 840px; margin-bottom: 25px; }
        .stat-card {
            background: rgba(15, 23, 42, 0.85); border-radius: 20px; padding: 24px 18px; text-align: center;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4); border-top: 5px solid var(--cyan);
        }
        .stat-card.confirmed { border-top-color: var(--exito); }
        .stat-card.pending { border-top-color: var(--alerta); }
        .stat-num { font-size: 2.8rem; font-weight: 900; line-height: 1.1; margin: 6px 0; color: white; }

        .panel-table-wrap {
            background: rgba(15, 23, 42, 0.85); border-radius: 26px; padding: 35px 28px; width: 100%; max-width: 840px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);
        }
        .tools-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .search-in {
            flex: 1; min-width: 240px; padding: 12px 18px; border: 1.5px solid rgba(255, 255, 255, 0.15);
            background: rgba(7, 13, 23, 0.8); color: white; border-radius: 50px; font-size: 0.85rem; outline: none; font-family: inherit;
        }
        .btn-exp {
            background: linear-gradient(135deg, var(--cyan), var(--purpura)); color: white; border: none; padding: 12px 22px;
            border-radius: 50px; font-size: 0.75rem; font-weight: 800; letter-spacing: 1px;
            text-transform: uppercase; cursor: pointer;
        }

        .guests-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
        .guests-table th { text-align: left; padding: 14px 16px; background: rgba(7, 13, 23, 0.6); color: var(--cyan); font-size: 0.72rem; text-transform: uppercase; border-bottom: 2px solid rgba(255, 255, 255, 0.1); font-weight: 700; }
        .guests-table td { padding: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }

        @media (max-width: 650px) { .stats-grid { grid-template-columns: 1fr; } }
    </style>
</head>

<body>

    <header>
        <h1>Alex 25th Birthday</h1>
        <p>Dashboard de Accesos VIP en Tiempo Real</p>
        <div class="nav-pills">
            <a href="index.html" class="pill-btn" target="_blank">👁️ Ver Invitación</a>
            <a href="admin.html" class="pill-btn">⚙️ Generador de Accesos</a>
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card confirmed">
            <div style="font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; color: var(--plata); font-weight: 700;">Confirmados</div>
            <div class="stat-num" id="statConf">0</div>
            <span style="font-size: 0.72rem; color: #4ade80; font-weight: 600;">Asistirán al Rooftop</span>
        </div>
        <div class="stat-card pending">
            <div style="font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; color: var(--plata); font-weight: 700;">Pendientes</div>
            <div class="stat-num" id="statPend">0</div>
            <span style="font-size: 0.72rem; color: #fcd34d; font-weight: 600;">Por confirmar</span>
        </div>
        <div class="stat-card">
            <div style="font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; color: var(--plata); font-weight: 700;">Total Accesos</div>
            <div class="stat-num" id="statTot">0</div>
            <span style="font-size: 0.72rem; color: var(--plata); font-weight: 600;">Registrados</span>
        </div>
    </div>

    <div class="panel-table-wrap">
        <div class="tools-bar">
            <input type="text" class="search-in" id="inpSearch" placeholder="🔍 Buscar invitado..." onkeyup="filtrar()">
            <button class="btn-exp" onclick="descargarCSV()">📥 Exportar a Excel (CSV)</button>
        </div>

        <div style="overflow-x: auto;">
            <table class="guests-table">
                <thead>
                    <tr>
                        <th>Invitado / Grupo</th>
                        <th>Accesos</th>
                        <th>Estado de Asistencia</th>
                    </tr>
                </thead>
                <tbody id="rowsBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const local = JSON.parse(localStorage.getItem('fiesta_alex_invitados') || '[]');
        let registros = local;

        function render(filtro = '') {
            const tbody = document.getElementById('rowsBody');
            tbody.innerHTML = '';
            let total = 0, conf = 0, pend = 0;

            registros.forEach(item => {
                const n = parseInt(item.pases) || 1;
                total += n;
                if (item.confirmado && item.confirmado.toLowerCase().includes('sí')) conf += n;
                else pend += n;
            });

            document.getElementById('statTot').innerText = total;
            document.getElementById('statConf').innerText = conf;
            document.getElementById('statPend').innerText = pend;

            const filtrados = registros.filter(r => r.familia.toLowerCase().includes(filtro.toLowerCase()));

            if (filtrados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #94a3b8; padding: 25px;">No hay registros disponibles.</td></tr>`;
                return;
            }

            filtrados.forEach(r => {
                const tr = document.createElement('tr');
                const isSi = r.confirmado && r.confirmado.toLowerCase().includes('sí');
                tr.innerHTML = `
                    <td style="font-weight: 600;">${r.familia}</td>
                    <td><strong>${r.pases}</strong></td>
                    <td><span style="background: ${isSi ? 'rgba(34,197,94,0.2)' : 'rgba(245,158,11,0.2)'}; color: ${isSi ? '#4ade80' : '#fcd34d'}; padding: 4px 12px; border-radius: 50px; font-weight: 700; font-size: 0.72rem;">${isSi ? 'Confirmado ✅' : 'Pendiente ⏳'}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filtrar() { render(document.getElementById('inpSearch').value); }

        function descargarCSV() {
            let csv = 'Invitado,Accesos,Confirmado\n';
            registros.forEach(r => { csv += `"${r.familia}",${r.pases},"${r.confirmado}"\n`; });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `confirmados_Fiesta_Alex_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }
        render();
    </script>
</body>

</html>

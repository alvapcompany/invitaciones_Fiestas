<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Confirmados — XV Valeria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --esmeralda-dark: #041a12;
            --esmeralda-joya: #0b533b;
            --oro: #d4af37;
            --exito: #16a34a;
            --alerta: #b45309;
            --plata-texto: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 50%, #f0fdf4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 16px 80px;
            color: #062419;
        }

        header { text-align: center; margin-bottom: 30px; width: 100%; max-width: 820px; }
        header h1 { font-family: 'Great Vibes', cursive; font-size: 3.8rem; color: var(--esmeralda-joya); line-height: 1.1; }
        header p { font-family: 'Cinzel', serif; font-size: 0.85rem; letter-spacing: 4px; color: var(--oro); text-transform: uppercase; font-weight: 700; margin-top: 5px; }

        .nav-pills { display: flex; justify-content: center; gap: 12px; margin-top: 15px; flex-wrap: wrap; }
        .pill-btn {
            background: white; border: 1.5px solid var(--oro); padding: 8px 18px; border-radius: 50px;
            font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--esmeralda-joya); text-decoration: none;
            transition: all 0.3s;
        }
        .pill-btn:hover { background: var(--esmeralda-joya); color: white; transform: translateY(-2px); }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; width: 100%; max-width: 840px; margin-bottom: 25px; }
        .stat-card {
            background: white; border-radius: 20px; padding: 24px 18px; text-align: center;
            box-shadow: 0 12px 30px rgba(11, 83, 59, 0.08); border-top: 5px solid var(--oro);
        }
        .stat-card.confirmed { border-top-color: var(--exito); }
        .stat-card.pending { border-top-color: var(--alerta); }
        .stat-num { font-family: 'Cinzel', serif; font-size: 2.8rem; font-weight: 800; line-height: 1.1; margin: 6px 0; color: var(--esmeralda-joya); }

        .panel-table-wrap {
            background: white; border-radius: 26px; padding: 35px 28px; width: 100%; max-width: 840px;
            box-shadow: 0 20px 45px rgba(11, 83, 59, 0.1);
        }
        .tools-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .search-in {
            flex: 1; min-width: 240px; padding: 12px 18px; border: 2px solid #bbf7d0;
            border-radius: 50px; font-size: 0.85rem; outline: none; font-family: inherit;
        }
        .btn-exp {
            background: var(--esmeralda-joya); color: white; border: none; padding: 12px 22px;
            border-radius: 50px; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px;
            text-transform: uppercase; cursor: pointer;
        }

        .guests-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
        .guests-table th { text-align: left; padding: 14px 16px; background: #f0fdf4; color: var(--esmeralda-joya); font-size: 0.72rem; text-transform: uppercase; border-bottom: 2px solid #bbf7d0; font-weight: 700; }
        .guests-table td { padding: 16px; border-bottom: 1px solid #f0fdf4; }

        @media (max-width: 650px) { .stats-grid { grid-template-columns: 1fr; } }
    </style>
</head>

<body>

    <header>
        <h1>Valeria</h1>
        <p>Dashboard de Confirmaciones en Tiempo Real</p>
        <div class="nav-pills">
            <a href="index.html" class="pill-btn" target="_blank">👁️ Ver Invitación</a>
            <a href="admin.html" class="pill-btn">⚙️ Generador de Pases</a>
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card confirmed">
            <div style="font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; color: var(--plata-texto); font-weight: 700;">Confirmados</div>
            <div class="stat-num" id="statConf">0</div>
            <span style="font-size: 0.72rem; color: #16a34a; font-weight: 600;">Asistirán al evento</span>
        </div>
        <div class="stat-card pending">
            <div style="font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; color: var(--plata-texto); font-weight: 700;">Pendientes</div>
            <div class="stat-num" id="statPend">0</div>
            <span style="font-size: 0.72rem; color: #b45309; font-weight: 600;">Por confirmar</span>
        </div>
        <div class="stat-card">
            <div style="font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; color: var(--plata-texto); font-weight: 700;">Total Pases</div>
            <div class="stat-num" id="statTot">0</div>
            <span style="font-size: 0.72rem; color: var(--plata-texto); font-weight: 600;">Registrados</span>
        </div>
    </div>

    <div class="panel-table-wrap">
        <div class="tools-bar">
            <input type="text" class="search-in" id="inpSearch" placeholder="🔍 Buscar familia o invitado..." onkeyup="filtrar()">
            <button class="btn-exp" onclick="descargarCSV()">📥 Exportar a Excel (CSV)</button>
        </div>

        <div style="overflow-x: auto;">
            <table class="guests-table">
                <thead>
                    <tr>
                        <th>Familia / Invitado</th>
                        <th>Pases</th>
                        <th>Estado de Asistencia</th>
                    </tr>
                </thead>
                <tbody id="rowsBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const local = JSON.parse(localStorage.getItem('xv_valeria_invitados') || '[]');
        let registros = local;

        function render(filtro = '') {
            const tbody = document.getElementById('rowsBody');
            tbody.innerHTML = '';
            let total = 0, conf = 0, pend = 0;

            registros.forEach(item => {
                const n = parseInt(item.pases) || 1;
                total += n;
                if (item.confirmado && item.confirmado.toLowerCase().includes('sí')) conf += n;
                else pend += n;
            });

            document.getElementById('statTot').innerText = total;
            document.getElementById('statConf').innerText = conf;
            document.getElementById('statPend').innerText = pend;

            const filtrados = registros.filter(r => r.familia.toLowerCase().includes(filtro.toLowerCase()));

            if (filtrados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #94a3b8; padding: 25px;">No hay registros disponibles.</td></tr>`;
                return;
            }

            filtrados.forEach(r => {
                const tr = document.createElement('tr');
                const isSi = r.confirmado && r.confirmado.toLowerCase().includes('sí');
                tr.innerHTML = `
                    <td style="font-weight: 600;">${r.familia}</td>
                    <td><strong>${r.pases}</strong></td>
                    <td><span style="background: ${isSi ? '#dcfce7' : '#fef3c7'}; color: ${isSi ? '#16a34a' : '#b45309'}; padding: 4px 12px; border-radius: 50px; font-weight: 700; font-size: 0.72rem;">${isSi ? 'Confirmado ✅' : 'Pendiente ⏳'}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filtrar() { render(document.getElementById('inpSearch').value); }

        function descargarCSV() {
            let csv = 'Familia,Pases,Confirmado\n';
            registros.forEach(r => { csv += `"${r.familia}",${r.pases},"${r.confirmado}"\n`; });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `confirmados_XV_Valeria_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }
        render();
    </script>
</body>

</html>

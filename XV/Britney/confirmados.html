<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Confirmados — XV Britney</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --azul-profundo: #041220;
            --turquesa: #0097a7;
            --turquesa-oscuro: #00838f;
            --cyan-glow: #4dd0e1;
            --exito: #2e7d32;
            --alerta: #f57f17;
            --plata-texto: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #e6f6f9 0%, #d6f2f8 50%, #e6f6f9 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 16px 80px;
            color: var(--azul-profundo);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 820px;
        }

        header h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3.8rem;
            color: var(--turquesa);
            text-shadow: 0 2px 10px rgba(0, 151, 167, 0.2);
            line-height: 1.1;
        }

        header p {
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 4px;
            color: var(--turquesa-oscuro);
            text-transform: uppercase;
            font-weight: 700;
            margin-top: 5px;
        }

        .nav-pills {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .pill-btn {
            background: white;
            border: 1.5px solid var(--cyan-glow);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--turquesa);
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(0, 151, 167, 0.08);
            transition: all 0.3s;
        }

        .pill-btn:hover {
            background: var(--turquesa);
            color: white;
            transform: translateY(-2px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            width: 100%;
            max-width: 840px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 24px 18px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0, 115, 130, 0.08);
            border-top: 5px solid var(--turquesa);
            transition: transform 0.3s;
        }

        .stat-card.confirmed { border-top-color: var(--exito); }
        .stat-card.pending { border-top-color: var(--alerta); }

        .stat-num {
            font-family: 'Cinzel', serif;
            font-size: 2.8rem;
            font-weight: 800;
            line-height: 1.1;
            margin: 6px 0;
        }

        .stat-card.confirmed .stat-num { color: var(--exito); }
        .stat-card.pending .stat-num { color: var(--alerta); }

        .stat-title {
            font-size: 0.72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--plata-texto);
            font-weight: 700;
        }

        .panel-table-wrap {
            background: white;
            border-radius: 26px;
            padding: 35px 28px;
            width: 100%;
            max-width: 840px;
            box-shadow: 0 20px 45px rgba(0, 115, 130, 0.1);
        }

        .tools-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-in {
            flex: 1;
            min-width: 240px;
            padding: 12px 18px;
            border: 2px solid #e0f2f1;
            border-radius: 50px;
            font-size: 0.85rem;
            outline: none;
            font-family: inherit;
        }

        .search-in:focus {
            border-color: var(--turquesa);
        }

        .btn-tool {
            background: #e0f7fa;
            color: var(--turquesa);
            border: 1.5px solid var(--cyan-glow);
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
        }

        .btn-tool:hover {
            background: var(--turquesa);
            color: white;
        }

        .table-data {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .table-data th {
            text-align: left;
            padding: 12px 14px;
            background: #f7fcfd;
            color: var(--turquesa-oscuro);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #e0f2f1;
        }

        .table-data td {
            padding: 14px;
            border-bottom: 1px solid #f0f4f5;
        }

        .pill-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .pill-badge.si { background: #e8f5e9; color: var(--exito); }
        .pill-badge.no { background: #fff8e1; color: var(--alerta); }

        @media (max-width: 650px) {
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

    <header>
        <h1>Britney</h1>
        <p>Dashboard de Confirmaciones en Tiempo Real</p>
        <div class="nav-pills">
            <a href="index.html" class="pill-btn" target="_blank">👁️ Invitación Digital</a>
            <a href="admin.html" class="pill-btn">⚙️ Generador de Pases</a>
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card confirmed">
            <div class="stat-title">Pases Confirmados</div>
            <div class="stat-num" id="statConf">0</div>
            <span style="font-size: 0.72rem; color: #2e7d32; font-weight: 600;">Asistirán al evento</span>
        </div>

        <div class="stat-card pending">
            <div class="stat-title">Pases Pendientes</div>
            <div class="stat-num" id="statPend">0</div>
            <span style="font-size: 0.72rem; color: #f57f17; font-weight: 600;">Por confirmar</span>
        </div>

        <div class="stat-card">
            <div class="stat-title">Total de Pases</div>
            <div class="stat-num" id="statTot">0</div>
            <span style="font-size: 0.72rem; color: var(--turquesa-oscuro); font-weight: 600;">En lista</span>
        </div>
    </div>

    <div class="panel-table-wrap">
        <div class="tools-bar">
            <input type="text" id="inpSearch" class="search-in" placeholder="🔍 Buscar familia o invitado..." oninput="filtrar()">
            <button class="btn-tool" onclick="cargarRegistros()">🔄 Actualizar de Sheets</button>
            <button class="btn-tool" onclick="descargarCSV()">📥 Descargar CSV</button>
        </div>

        <div style="overflow-x: auto;">
            <table class="table-data">
                <thead>
                    <tr>
                        <th>Familia / Invitado</th>
                        <th>Lugares</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="rowsBody">
                    <!-- Dinámico -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // =========================================================================
        // 📝 CONFIGURACIÓN DE GOOGLE APPS SCRIPT
        // Modifica la siguiente URL cuando utilices este panel para otro cliente:
        // =========================================================================
        const CONFIG_DASHBOARD = {
            GOOGLE_SHEETS_URL: 'https://script.google.com/macros/s/AKfycbzt82an0oeBTjo4TncRopBnd85Yvm5AaUqfQKWCSJwy_ZhN8G5wBvWGoJXBl3h61ZAWSg/exec'
        };
        // =========================================================================

        let registros = [];

        async function cargarRegistros() {
            try {
                if (CONFIG_DASHBOARD.GOOGLE_SHEETS_URL) {
                    const res = await fetch(CONFIG_DASHBOARD.GOOGLE_SHEETS_URL);
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        registros = data.map(item => ({
                            familia: item.familia || item.Familia || 'Invitado',
                            pases: parseInt(item.pases || item.Pases || 1),
                            confirmado: item.confirmado || item.Confirmado || 'Pendiente'
                        }));
                        render();
                        return;
                    }
                }
            } catch (e) {
                console.warn('Conexión Sheets fallida, cargando memoria local:', e);
            }

            const local = JSON.parse(localStorage.getItem('xv_britney_invitados') || '[]');
            registros = local;
            render();
        }

        function render(filtro = '') {
            const tbody = document.getElementById('rowsBody');
            tbody.innerHTML = '';

            let total = 0;
            let conf = 0;
            let pend = 0;

            registros.forEach(item => {
                const n = parseInt(item.pases) || 1;
                total += n;
                const isSi = item.confirmado && item.confirmado.toLowerCase().includes('sí');
                if (isSi) conf += n;
                else pend += n;
            });

            document.getElementById('statTot').innerText = total;
            document.getElementById('statConf').innerText = conf;
            document.getElementById('statPend').innerText = pend;

            const filtrados = registros.filter(r => 
                r.familia.toLowerCase().includes(filtro.toLowerCase())
            );

            if (filtrados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #94a3b8; padding: 25px;">No se encontraron registros.</td></tr>`;
                return;
            }

            filtrados.forEach(r => {
                const tr = document.createElement('tr');
                const isSi = r.confirmado && r.confirmado.toLowerCase().includes('sí');
                tr.innerHTML = `
                    <td style="font-weight: 600;">${r.familia}</td>
                    <td><strong>${r.pases}</strong></td>
                    <td>
                        <span class="pill-badge ${isSi ? 'si' : 'no'}">
                            ${isSi ? 'Confirmado ✅' : 'Pendiente ⏳'}
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filtrar() {
            render(document.getElementById('inpSearch').value);
        }

        function descargarCSV() {
            let csv = 'Familia,Pases,Confirmado\n';
            registros.forEach(r => {
                csv += `"${r.familia}",${r.pases},"${r.confirmado}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `confirmados_XV_Britney_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        cargarRegistros();
    </script>
</body>

</html>

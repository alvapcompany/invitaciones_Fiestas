<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Confirmados — XV Britney</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --azul-profundo: #071527;
            --azul-turquesa: #0097a7;
            --azul-claro: #4dd0e1;
            --azul-gala: #00838f;
            --exito: #2e7d32;
            --alerta: #f57f17;
            --plata-medio: #cbd5e1;
            --plata-oscuro: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #e6f6f9 0%, #d6f2f8 50%, #e6f6f9 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 16px 80px;
            color: var(--azul-profundo);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 820px;
            position: relative;
        }

        header h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3.8rem;
            color: var(--azul-turquesa);
            text-shadow: 0 2px 10px rgba(0, 151, 167, 0.2);
            line-height: 1.1;
        }

        header p {
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 4px;
            color: var(--azul-gala);
            text-transform: uppercase;
            font-weight: 700;
            margin-top: 5px;
        }

        .nav-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn-link {
            background: white;
            border: 1.5px solid var(--azul-claro);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--azul-turquesa);
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(0, 151, 167, 0.08);
            transition: all 0.3s;
        }

        .btn-link:hover {
            background: var(--azul-turquesa);
            color: white;
            transform: translateY(-2px);
        }

        /* --- Métricas Cards --- */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            width: 100%;
            max-width: 820px;
            margin-bottom: 25px;
        }

        .metric-card {
            background: white;
            border-radius: 20px;
            padding: 24px 18px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0, 115, 130, 0.08);
            border-top: 5px solid var(--azul-turquesa);
            transition: transform 0.3s;
        }

        .metric-card:hover {
            transform: translateY(-4px);
        }

        .metric-card.confirmed { border-top-color: var(--exito); }
        .metric-card.pending { border-top-color: var(--alerta); }

        .metric-value {
            font-family: 'Cinzel', serif;
            font-size: 2.8rem;
            font-weight: 800;
            line-height: 1.1;
            margin: 6px 0;
            color: var(--azul-profundo);
        }

        .metric-card.confirmed .metric-value { color: var(--exito); }
        .metric-card.pending .metric-value { color: var(--alerta); }

        .metric-label {
            font-size: 0.72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--plata-oscuro);
            font-weight: 700;
        }

        /* --- Panel de la Tabla --- */
        .table-panel {
            background: white;
            border-radius: 26px;
            padding: 35px 28px;
            width: 100%;
            max-width: 820px;
            box-shadow: 0 20px 45px rgba(0, 115, 130, 0.1);
        }

        .table-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 240px;
            padding: 12px 18px;
            border: 2px solid #e0f2f1;
            border-radius: 50px;
            font-size: 0.85rem;
            outline: none;
            font-family: inherit;
        }

        .search-input:focus {
            border-color: var(--azul-turquesa);
        }

        .btn-action {
            background: #e0f7fa;
            color: var(--azul-turquesa);
            border: 1.5px solid var(--azul-claro);
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-action:hover {
            background: var(--azul-turquesa);
            color: white;
        }

        .confirm-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .confirm-table th {
            text-align: left;
            padding: 12px 14px;
            background: #f7fcfd;
            color: var(--azul-gala);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #e0f2f1;
        }

        .confirm-table td {
            padding: 14px;
            border-bottom: 1px solid #f0f4f5;
        }

        .badge-status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-status.si { background: #e8f5e9; color: var(--exito); }
        .badge-status.no { background: #fff8e1; color: var(--alerta); }

        @media (max-width: 650px) {
            .metrics-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Britney</h1>
        <p>Dashboard de Asistencia en Tiempo Real</p>
        <div class="nav-links">
            <a href="index.html" class="btn-link" target="_blank">👁️ Invitación Digital</a>
            <a href="admin.html" class="btn-link">⚙️ Panel Admin</a>
        </div>
    </header>

    <!-- Métricas -->
    <div class="metrics-grid">
        <div class="metric-card confirmed">
            <div class="metric-label">Pases Confirmados</div>
            <div class="metric-value" id="countConfirmados">0</div>
            <span style="font-size: 0.72rem; color: #2e7d32; font-weight: 600;">Asistirán al evento</span>
        </div>

        <div class="metric-card pending">
            <div class="metric-label">Pases Pendientes</div>
            <div class="metric-value" id="countPendientes">0</div>
            <span style="font-size: 0.72rem; color: #f57f17; font-weight: 600;">Por confirmar</span>
        </div>

        <div class="metric-card">
            <div class="metric-label">Total de Pases</div>
            <div class="metric-value" id="countTotal">0</div>
            <span style="font-size: 0.72rem; color: var(--azul-gala); font-weight: 600;">Reservados en lista</span>
        </div>
    </div>

    <!-- Tabla -->
    <div class="table-panel">
        <div class="table-toolbar">
            <input type="text" id="inpBuscar" class="search-input" placeholder="🔍 Buscar familia o invitado..." oninput="filtrarTabla()">
            <button class="btn-action" onclick="cargarDatos()">🔄 Actualizar</button>
            <button class="btn-action" onclick="exportarCSV()">📥 Exportar CSV</button>
        </div>

        <div style="overflow-x: auto;">
            <table class="confirm-table">
                <thead>
                    <tr>
                        <th>Familia / Invitado</th>
                        <th>Lugares</th>
                        <th>Estado de Asistencia</th>
                    </tr>
                </thead>
                <tbody id="tablaBody">
                    <!-- Dinámico -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // =========================================================================
        // 📝 CONFIGURACIÓN DE GOOGLE SHEETS PARA ESTA INVITACIÓN
        // Cambia la siguiente URL al crear una invitación para otro cliente:
        // =========================================================================
        const CONFIG_CONFIRMADOS = {
            GOOGLE_SHEETS_URL: 'https://script.google.com/macros/s/AKfycbzt82an0oeBTjo4TncRopBnd85Yvm5AaUqfQKWCSJwy_ZhN8G5wBvWGoJXBl3h61ZAWSg/exec'
        };
        // =========================================================================

        let listaDatos = [];

        async function cargarDatos() {
            // Intentar primero desde Google Apps Script
            try {
                if (CONFIG_CONFIRMADOS.GOOGLE_SHEETS_URL) {
                    const res = await fetch(CONFIG_CONFIRMADOS.GOOGLE_SHEETS_URL);
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        listaDatos = data.map(item => ({
                            familia: item.familia || item.Familia || item.nombre || 'Invitado',
                            pases: parseInt(item.pases || item.Pases || 1),
                            confirmado: item.confirmado || item.Confirmado || 'Pendiente'
                        }));
                        renderizarTabla();
                        return;
                    }
                }
            } catch (err) {
                console.warn('Usando respaldo local ante fallo de conexión con Google Sheets:', err);
            }

            // Respaldo desde LocalStorage
            const local = JSON.parse(localStorage.getItem('xv_britney_invitados') || '[]');
            listaDatos = local;
            renderizarTabla();
        }

        function renderizarTabla(filtro = '') {
            const tbody = document.getElementById('tablaBody');
            tbody.innerHTML = '';

            let totalPases = 0;
            let confirmados = 0;
            let pendientes = 0;

            listaDatos.forEach(item => {
                const pasesNum = parseInt(item.pases) || 1;
                totalPases += pasesNum;
                const esSi = item.confirmado && item.confirmado.toLowerCase().includes('sí');
                if (esSi) confirmados += pasesNum;
                else pendientes += pasesNum;
            });

            document.getElementById('countTotal').innerText = totalPases;
            document.getElementById('countConfirmados').innerText = confirmados;
            document.getElementById('countPendientes').innerText = pendientes;

            const filtrados = listaDatos.filter(i => 
                i.familia.toLowerCase().includes(filtro.toLowerCase())
            );

            if (filtrados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #94a3b8; padding: 25px;">No se encontraron invitados.</td></tr>`;
                return;
            }

            filtrados.forEach(i => {
                const tr = document.createElement('tr');
                const esSi = i.confirmado && i.confirmado.toLowerCase().includes('sí');
                tr.innerHTML = `
                    <td style="font-weight: 600; color: #071527;">${i.familia}</td>
                    <td><strong>${i.pases}</strong></td>
                    <td>
                        <span class="badge-status ${esSi ? 'si' : 'no'}">
                            ${esSi ? 'Confirmado ✅' : 'Pendiente ⏳'}
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filtrarTabla() {
            const q = document.getElementById('inpBuscar').value;
            renderizarTabla(q);
        }

        function exportarCSV() {
            let csv = 'Familia,Pases,Confirmado\n';
            listaDatos.forEach(i => {
                csv += `"${i.familia}",${i.pases},"${i.confirmado}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `confirmados_XV_Britney_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        cargarDatos();
    </script>
</body>

</html>

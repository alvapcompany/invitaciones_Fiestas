<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Confirmados — Boda Elena & Carlos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --navy-boda: #0a192f;
            --oro: #d4af37;
            --exito: #2e7d32;
            --alerta: #b45309;
            --texto-oscuro: #0a192f;
            --plata: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 16px 80px;
            color: var(--texto-oscuro);
        }

        header { text-align: center; margin-bottom: 30px; width: 100%; max-width: 820px; }
        header h1 { font-family: 'Great Vibes', cursive; font-size: 3.8rem; color: var(--navy-boda); line-height: 1.1; }
        header p { font-family: 'Cinzel', serif; font-size: 0.85rem; letter-spacing: 4px; color: var(--oro); text-transform: uppercase; font-weight: 700; margin-top: 5px; }

        .nav-pills { display: flex; justify-content: center; gap: 12px; margin-top: 15px; flex-wrap: wrap; }
        .pill-btn {
            background: white; border: 1.5px solid var(--navy-boda); padding: 8px 18px; border-radius: 50px;
            font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--navy-boda); text-decoration: none;
            transition: all 0.3s;
        }
        .pill-btn:hover { background: var(--navy-boda); color: white; transform: translateY(-2px); }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; width: 100%; max-width: 840px; margin-bottom: 25px; }
        .stat-card {
            background: white; border-radius: 20px; padding: 24px 18px; text-align: center;
            box-shadow: 0 12px 30px rgba(10, 25, 47, 0.08); border-top: 5px solid var(--oro);
        }
        .stat-card.confirmed { border-top-color: var(--exito); }
        .stat-card.pending { border-top-color: var(--alerta); }
        .stat-num { font-family: 'Cinzel', serif; font-size: 2.8rem; font-weight: 800; line-height: 1.1; margin: 6px 0; color: var(--navy-boda); }

        .panel-table-wrap {
            background: white; border-radius: 26px; padding: 35px 28px; width: 100%; max-width: 840px;
            box-shadow: 0 20px 45px rgba(10, 25, 47, 0.08);
        }
        .tools-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .search-in {
            flex: 1; min-width: 240px; padding: 12px 18px; border: 2px solid #cbd5e1;
            border-radius: 50px; font-size: 0.85rem; outline: none; font-family: inherit;
        }
        .btn-exp {
            background: var(--navy-boda); color: white; border: none; padding: 12px 22px;
            border-radius: 50px; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px;
            text-transform: uppercase; cursor: pointer;
        }

        .guests-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
        .guests-table th { text-align: left; padding: 14px 16px; background: #f8fafc; color: var(--navy-boda); font-size: 0.72rem; text-transform: uppercase; border-bottom: 2px solid #cbd5e1; font-weight: 700; }
        .guests-table td { padding: 16px; border-bottom: 1px solid #f1f5f9; }

        @media (max-width: 650px) { .stats-grid { grid-template-columns: 1fr; } }
    </style>
</head>

<body>

    <header>
        <h1>Elena & Carlos</h1>
        <p>Dashboard de Asistencia Nupcial</p>
        <div class="nav-pills">
            <a href="index.html" class="pill-btn" target="_blank">👁️ Ver Invitación</a>
            <a href="admin.html" class="pill-btn">⚙️ Generador de Pases</a>
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card confirmed">
            <div style="font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; color: var(--plata); font-weight: 700;">Confirmados</div>
            <div class="stat-num" id="statConf">0</div>
            <span style="font-size: 0.72rem; color: #2e7d32; font-weight: 600;">Asistirán a la boda</span>
        </div>
        <div class="stat-card pending">
            <div style="font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; color: var(--plata); font-weight: 700;">Pendientes</div>
            <div class="stat-num" id="statPend">0</div>
            <span style="font-size: 0.72rem; color: #b45309; font-weight: 600;">Por confirmar</span>
        </div>
        <div class="stat-card">
            <div style="font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; color: var(--plata); font-weight: 700;">Total Pases</div>
            <div class="stat-num" id="statTot">0</div>
            <span style="font-size: 0.72rem; color: var(--plata); font-weight: 600;">Reservados</span>
        </div>
    </div>

    <div class="panel-table-wrap">
        <div class="tools-bar">
            <input type="text" class="search-in" id="inpSearch" placeholder="🔍 Buscar familia o invitado..." onkeyup="filtrar()">
            <button class="btn-exp" onclick="cargarRegistros()" style="margin-right:8px;">🔄 Actualizar de Sheets</button>
            <button class="btn-exp" onclick="descargarCSV()">📥 Exportar a Excel (CSV)</button>
        </div>

        <div style="overflow-x: auto;">
            <table class="guests-table">
                <thead>
                    <tr>
                        <th>Familia / Invitado</th>
                        <th>Pases</th>
                        <th>Estado</th>
                        <th>Fecha Confirmación</th>
                        <th>Invitación</th>
                        <th>Fecha Confirmación</th>
                        <th>Invitación</th>
                    </tr>
                </thead>
                <tbody id="rowsBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const GOOGLE_SHEETS_URL = ''; // Pega aquí la URL de Google Apps Script del cliente (/exec)
        const LOCAL_STORAGE_KEY = 'boda_elena_carlos_invitados';
        let registros = [];

        async function cargarRegistros() {
            try {
                if (GOOGLE_SHEETS_URL) {
                    const res = await fetch(GOOGLE_SHEETS_URL);
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        registros = data.map(item => ({
                            familia: item.nombre || item.familia || 'Invitado',
                            pases: parseInt(item.pases || 1),
                            confirmado: item.confirmado || 'Pendiente',
                            fecha: item.fecha_confirmacion || '',
                            link: item.link_invitacion || item.link || ''
                        }));
                        render();
                        return;
                    }
                }
            } catch (e) {
                console.warn('Conexión Sheets fallida, cargando local:', e);
            }

            registros = JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY) || '[]');
            render();
        }

        function render(filtro = '') {
            const tbody = document.getElementById('rowsBody');
            tbody.innerHTML = '';
            let total = 0, conf = 0, pend = 0;

            registros.forEach(item => {
                const n = parseInt(item.pases) || 1;
                total += n;
                const isSi = item.confirmado && item.confirmado.toLowerCase().includes('sí');
                if (isSi) conf += n;
                else pend += n;
            });

            if (document.getElementById('statTot')) document.getElementById('statTot').innerText = total;
            if (document.getElementById('statConf')) document.getElementById('statConf').innerText = conf;
            if (document.getElementById('statPend')) document.getElementById('statPend').innerText = pend;

            const filtrados = registros.filter(r => (r.familia || '').toLowerCase().includes(filtro.toLowerCase()));

            if (filtrados.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #94a3b8; padding: 25px;">No hay registros disponibles.</td></tr>';
                return;
            }

            filtrados.forEach(r => {
                const tr = document.createElement('tr');
                const isSi = r.confirmado && r.confirmado.toLowerCase().includes('sí');
                const fechaTxt = r.fecha || '—';
                const linkBtn = r.link ? `<button style="padding: 4px 10px; border-radius: 50px; border: none; background: #e0f2f1; color: #00796b; font-weight: 700; font-size: 0.72rem; cursor: pointer;" onclick="navigator.clipboard.writeText('${r.link}'); alert('¡Enlace copiado!');">📋 Copiar</button>` : '—';
                tr.innerHTML = `
                    <td style="font-weight: 600;">${r.familia}</td>
                    <td><strong>${r.pases}</strong></td>
                    <td><span style="background: ${isSi ? '#e8f5e9' : '#fef3c7'}; color: ${isSi ? '#2e7d32' : '#b45309'}; padding: 4px 12px; border-radius: 50px; font-weight: 700; font-size: 0.72rem;">${isSi ? 'Confirmado ✅' : 'Pendiente ⏳'}</span></td>
                    <td style="font-size: 0.75rem; color: #64748b;">${fechaTxt}</td>
                    <td>${linkBtn}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filtrar() {
            render(document.getElementById('inpSearch').value);
        }

        function descargarCSV() {
            let csv = 'Nombre,Pases,Confirmado,Fecha_Confirmacion,Link_Invitacion
';
            registros.forEach(r => {
                csv += `"${r.familia}",${r.pases},"${r.confirmado}","${r.fecha || ''}","${r.link || ''}"
`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `confirmados_${LOCAL_STORAGE_KEY}_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        cargarRegistros();
    </script>
</body>

</html>
